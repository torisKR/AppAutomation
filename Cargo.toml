[package]
name = "appforge"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Subscription-first multi-agent app factory with a clickable terminal UI"
license = "MIT"
repository = "https://github.com/torisKR/AppAutomation"

[[bin]]
name = "appforge"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
